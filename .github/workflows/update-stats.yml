name: Update Problem Solving Statistics

on:
  schedule:
    # 16:35 UTC = 22:35 Bangladesh time (UTC+6)
    - cron: "35 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: problem-solving-stats-update
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Dhaka
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch statistics and update README
        run: python scripts/auto_update.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md data/last_known_counts.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: auto-update problem-solving statistics"
          git push
